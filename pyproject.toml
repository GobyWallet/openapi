[project]
name = "goby-openapi"
version = "0.1.0"
description = "DeFi wallet API on Chia Network"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "async-timeout>=4.0.2",
    "aiohttp>=3.9.5",
    "PyYAML>=5.4.1",
    "logzero>=1.7.0",
    "aiocache>=0.12.3",
    "clvm>=0.9.7",
    "clvm-tools>=0.4.4",
    "SQLAlchemy[asyncio]>=2.0",
    "aiosqlite",
    "dynaconf>=3.1.11",
    "ujson",
]

[dependency-groups]
dev = [
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["openapi"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
